# Nightly compliance job trigger (docs/plan.md Phase 6).
# Render's free tier sleeps, so GitHub Actions is the scheduler: it wakes the API and runs
# recurrence expiry, overdue escalation, and the 30-day purge.
#
# Setup (one time): repo Settings → Secrets and variables → Actions →
#   - secret  JOB_SECRET  = same value as the JOB_SECRET env var on Render
#   - variable API_URL    = https://<your-api>.onrender.com
name: nightly-compliance-job

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC daily
  workflow_dispatch: {} # manual runs from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the job endpoint (retries while Render wakes up)
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 90 \
              -X POST "${{ vars.API_URL }}/jobs/run" \
              -H "x-job-secret: ${{ secrets.JOB_SECRET }}")
            echo "attempt $i: HTTP $code"; cat /tmp/out; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
