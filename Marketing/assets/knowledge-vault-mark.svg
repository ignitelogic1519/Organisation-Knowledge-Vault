<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Knowledge Vault">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152a"/>
      <stop offset="1" stop-color="#0a0d17"/>
    </linearGradient>
    <radialGradient id="anchorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2673f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e2673f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#ground)"/>

  <!-- distant field -->
  <g fill="#eef1fa">
    <circle cx="22" cy="24" r="1" opacity=".30"/><circle cx="104" cy="20" r="1.2" opacity=".24"/>
    <circle cx="112" cy="58" r="1" opacity=".22"/><circle cx="18" cy="74" r="1.1" opacity=".26"/>
    <circle cx="36" cy="106" r="1" opacity=".20"/><circle cx="96" cy="104" r="1.2" opacity=".24"/>
    <circle cx="66" cy="14" r="1" opacity=".22"/><circle cx="14" cy="46" r="1" opacity=".18"/>
  </g>

  <!-- the role tree: anchor star above, two owners, three leaves -->
  <g stroke="#eef1fa" stroke-opacity=".38" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M64 38 L42 68"/><path d="M64 38 L88 68"/>
    <path d="M42 68 L30 96"/><path d="M42 68 L56 96"/><path d="M88 68 L92 96"/>
  </g>

  <circle cx="64" cy="38" r="21" fill="url(#anchorGlow)"/>
  <circle cx="64" cy="38" r="7.5" fill="#e2673f"/>
  <circle cx="64" cy="38" r="3" fill="#fff6f1"/>

  <g fill="#eef1fa">
    <circle cx="42" cy="68" r="5"/><circle cx="88" cy="68" r="5"/>
    <circle cx="30" cy="96" r="3.4" opacity=".85"/>
    <circle cx="56" cy="96" r="3.4" opacity=".85"/>
    <circle cx="92" cy="96" r="3.4" opacity=".85"/>
  </g>
</svg>
